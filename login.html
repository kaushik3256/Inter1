<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .toggle-link { margin-top: 15px; cursor: pointer; color: blue; }
    </style>
</head>
<body>
<div class="form-container">
    <h2 id="form-title">Login</h2>
    <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" id="submit-btn">Login</button>
    </form>
    <p class="toggle-link" onclick="toggleForm()" id="toggle-text">Don't have an account? Sign Up</p>
</div>
<script>
    let isLogin = true;
    function toggleForm() {
        isLogin = !isLogin;
        document.getElementById('form-title').innerText = isLogin ? "Login" : "Sign Up";
        document.getElementById('submit-btn').innerText = isLogin ? "Login" : "Sign Up";
        document.getElementById('toggle-text').innerText = isLogin ? "Don't have an account? Sign Up" : "Already have an account? Login";
    }
</script>
</body>
</html>
